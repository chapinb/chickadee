[project]
name = "chickadee"
version = "20260208.0"
description = "Yet another GeoIP enrichment tool."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chapin Bryce", email = "mail@chapinb.com" }
]
keywords = ["geoip", "enrichment", "ip", "ip address", "security"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "Topic :: Utilities"
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "openpyxl>=3.1,<4.0",
    "tqdm>=4.65,<5.0",
    "netaddr>=0.8.0,<0.9.0",
    "python-evtx>=0.7.4,<0.8.0"
]

[project.scripts]
chickadee = "libchickadee.chickadee:entry"

[project.urls]
Homepage = "https://chapinb.com/chickadee/"
Documentation = "https://chapinb.com/chickadee/"
Repository = "https://github.com/chapinb/chickadee"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "types-requests",
    "pytest-watch",
    "types-openpyxl",
    "types-tqdm",
    "radon",
    "sphinx>=6.1.3,<7.0.0"
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["libchickadee"]

[tool.mypy]
exclude = [
    "build",
    "dist"
]

[[tool.mypy.overrides]]
module = [
    "Evtx",
    "Evtx.Evtx",
    "_io",
    "netaddr"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]
